services:
  - type: web
    name: jdbank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: jdbank-db
          property: connectionString

databases:
  - name: jdbank-db
    plan: free
    databaseName: jdbank