{% extends "base.html" %}

{% block title %}Вход — JDBank{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-16">
    <h1 class="text-2xl font-bold text-center mb-1">Вход в JDBank</h1>
    <p class="text-sm text-neutral-500 text-center mb-8">Введите имя пользователя и пароль</p>

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-neutral-700 mb-1">Имя пользователя</label>
            <input type="text" name="username" required autocomplete="username"
                   class="w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <div>
            <label class="block text-sm font-medium text-neutral-700 mb-1">Пароль</label>
            <input type="password" name="password" required autocomplete="current-password"
                   class="w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-2 rounded-lg transition-colors">Войти</button>
    </form>

    <p class="text-sm text-center text-neutral-500 mt-6">
        Нет аккаунта?
        <a href="/register" class="text-primary hover:underline font-medium">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
