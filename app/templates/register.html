{% extends "base.html" %}

{% block title %}Регистрация — JDBank{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-16">
    <h1 class="text-2xl font-bold text-center mb-1">Регистрация</h1>
    <p class="text-sm text-neutral-500 text-center mb-8">Создайте аккаунт за 10 секунд</p>

    <form method="post" action="/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-neutral-700 mb-1">Имя пользователя</label>
            <input type="text" name="username" required minlength="3" maxlength="50" autocomplete="username"
                   class="w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <div>
            <label class="block text-sm font-medium text-neutral-700 mb-1">Пароль</label>
            <input type="password" name="password" required minlength="6" autocomplete="new-password"
                   class="w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <div>
            <label class="block text-sm font-medium text-neutral-700 mb-1">Повторите пароль</label>
            <input type="password" name="password2" required autocomplete="new-password"
                   class="w-full border border-neutral-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
        </div>
        <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-2 rounded-lg transition-colors">Зарегистрироваться</button>
    </form>

    <p class="text-sm text-center text-neutral-500 mt-6">
        Уже есть аккаунт?
        <a href="/login" class="text-primary hover:underline font-medium">Войти</a>
    </p>
</div>
{% endblock %}
