<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JDBank{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#f97316',
                            dark: '#ea580c',
                            light: '#fed7aa'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-white text-neutral-900 min-h-screen flex flex-col">
    <header class="border-b border-neutral-200 bg-white sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight">
                <span class="text-black">JD</span><span class="text-primary">Bank</span>
            </a>
            <nav class="flex items-center gap-4 text-sm">
                {% if user %}
                    <span class="text-neutral-500 hidden sm:inline">Привет, {{ user.username }}</span>
                    <form method="post" action="/logout">
                        <button class="text-neutral-700 hover:text-primary font-medium">Выйти</button>
                    </form>
                {% else %}
                    <a href="/login" class="text-neutral-700 hover:text-primary font-medium">Вход</a>
                    <a href="/register"
                       class="bg-primary hover:bg-primary-dark text-white font-medium px-4 py-1.5 rounded-lg transition-colors">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    {% if error %}
    <div class="max-w-5xl mx-auto px-4 mt-4 w-full">
        <div class="bg-red-50 border border-red-300 text-red-700 text-sm px-4 py-2.5 rounded-lg">{{ error }}</div>
    </div>
    {% endif %}
    {% if success %}
    <div class="max-w-5xl mx-auto px-4 mt-4 w-full">
        <div class="bg-primary-light border border-primary text-orange-900 text-sm px-4 py-2.5 rounded-lg">{{ success }}</div>
    </div>
    {% endif %}

    <main class="flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-neutral-200 mt-10">
        <div class="max-w-5xl mx-auto px-4 py-4 text-xs text-neutral-400">JDBank — личный учёт финансов</div>
    </footer>
</body>
</html>
